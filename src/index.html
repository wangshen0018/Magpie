<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>磁力搜索</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;margin:0;padding:12px 12px 70px;background:#f5f6f8;color:#222}
h2{margin:0 0 10px;font-size:17px}
.bar{display:flex;gap:8px;margin-bottom:10px}
.qwrap{flex:1;position:relative}
.qwrap input{width:100%}
input{padding:11px 12px;border:1px solid #ccc;border-radius:8px;font-size:15px;outline:none}
input:focus{border-color:#007bff}
button{padding:11px 16px;border:none;border-radius:8px;background:#007bff;color:#fff;font-size:15px;cursor:pointer}
button:active{background:#0056b3}
button:disabled{background:#9bbce0}
.tabs{display:flex;gap:6px;margin-bottom:10px;font-size:13px}
.tab{padding:5px 12px;border-radius:14px;background:#e6eaef;color:#444;cursor:pointer;user-select:none}
.tab.on{background:#007bff;color:#fff}
.item{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.name{font-size:14px;line-height:1.35;word-break:break-all;margin-bottom:8px}
.meta{font-size:12px;color:#666;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seed{color:#25a244;font-weight:600}
.time{color:#8a6d3b}
.leech{color:#c1121f}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;background:#eef3fb;color:#0b5ed7}
.badge.b{background:#fff1e6;color:#c05621}
.badge.y{background:#e8f6ee;color:#1a7f4b}
.ops{display:flex;gap:8px;margin-left:auto}
.ops button{padding:6px 12px;font-size:13px;background:#eef3fb;color:#0b5ed7;border-radius:6px}
.ops button.pri{background:#007bff;color:#fff}
.hint{text-align:center;color:#999;font-size:13px;padding:24px 0}
.err{color:#c1121f;text-align:center;padding:16px}
.statusbar{display:flex;align-items:center;gap:14px;margin:0 0 10px;font-size:12px;color:#666}
.st{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.st .dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block}
.st.ok .dot{background:#25a244}
.st.fail .dot{background:#c1121f}
.st.on{font-weight:700}
.st-ts{margin-left:auto;color:#999;font-size:11px}

/* 代理开关 */
.px{padding:3px 9px;border-radius:12px;background:#e6eaef;color:#555;font-size:12px;cursor:pointer;user-select:none;border:none}
.px.on{background:#1a7f4b;color:#fff}

/* 搜索历史下拉 */
.hist{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #dbe6f5;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.1);z-index:30;max-height:260px;overflow:auto;display:none}
.hist .hh{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font-size:12px;color:#8a9bb0;background:#f8fafd;border-bottom:1px solid #eef3fa;position:sticky;top:0}
.hist .hh b{font-weight:600;color:#5b6b80}
.hist .clr{color:#007bff;cursor:pointer;padding:2px 6px}
.hist .hi{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid #f4f7fb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .hi:last-child{border-bottom:none}
.hist .hi:active{background:#f0f6ff}
.hist .hi i{color:#b7c3d4;font-style:normal;margin-right:6px;font-size:12px}

/* 底部下载进度 */
.taskbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e3e9f2;box-shadow:0 -2px 10px rgba(0,0,0,.06);z-index:40;padding-bottom:env(safe-area-inset-bottom);display:none}
.tb-sum{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:13px;cursor:pointer;user-select:none}
.tb-sum .tb-ico{color:#007bff;font-weight:700;min-width:12px;text-align:center}
.tb-sum .tb-txt{flex:1;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sum .tb-spd{color:#25a244;font-weight:600;font-size:12px}
.tb-sum .tb-caret{color:#9aa8ba;font-size:10px;transition:transform .15s}
.taskbar.open .tb-caret{transform:rotate(180deg)}
.tb-list{display:none;border-top:1px solid #f0f4fa;max-height:44vh;overflow:auto;padding:4px 0}
.taskbar.open .tb-list{display:block}
.tb-item{padding:8px 14px}
.tb-item .tn{font-size:12px;color:#444;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-item .pr{height:4px;background:#eef2f7;border-radius:2px;overflow:hidden}
.tb-item .pr i{display:block;height:100%;background:#007bff;border-radius:2px;transition:width .3s}
.tb-item .tm{display:flex;justify-content:space-between;font-size:11px;color:#8a9bb0;margin-top:4px}
</style>
</head>
<body>
<h2>🔍 磁力搜索</h2>
<div class="bar">
  <div class="qwrap">
    <input id="q" placeholder="片名 / 关键词（支持中文）" autocomplete="off">
    <div class="hist" id="hist"></div>
  </div>
  <button id="go" onclick="doSearch()">搜索</button>
</div>
<div class="statusbar" id="statusbar">
  <span class="st" data-k="btsow"><i class="dot"></i> BTSOW</span>
  <span class="st" data-k="tpb"><i class="dot"></i> TPB</span>
  <span class="st" data-k="yts"><i class="dot"></i> YTS</span>
  <button class="px" id="px" onclick="toggleProxy()">代理:关</button>
  <span class="st-ts" id="st-ts"></span>
</div>
<div class="tabs">
  <div class="tab on" data-src="all" onclick="setTab(this)">全部</div>
  <div class="tab" data-src="btsow" onclick="setTab(this)">BTSOW</div>
  <div class="tab" data-src="tpb" onclick="setTab(this)">TPB</div>
  <div class="tab" data-src="yts" onclick="setTab(this)">YTS</div>
</div>
<div id="out"><div class="hint">输入关键词开始搜索</div></div>

<div class="taskbar" id="taskbar">
  <div class="tb-sum" onclick="toggleTaskbar()">
    <span class="tb-ico" id="tb-ico">↓</span>
    <span class="tb-txt" id="tb-txt">—</span>
    <span class="tb-spd" id="tb-spd"></span>
    <span class="tb-caret">▲</span>
  </div>
  <div class="tb-list" id="tb-list"></div>
</div>
<script>
const out = document.getElementById('out');
const go  = document.getElementById('go');
const qEl = document.getElementById('q');
let CUR = 'all', ALL = [], REQ = 0;

function fmtSize(n){
  n = +n || 0;
  const u = ['B','KB','MB','GB','TB']; let i=0;
  while (n >= 1024 && i < 4) { n /= 1024; i++; }
  return n.toFixed(n < 10 && i > 1 ? 1 : 0) + ' ' + u[i];
}
function fmtTime(ts){
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s/60) + ' 分钟前';
  if (s < 86400) return Math.floor(s/3600) + ' 小时前';
  if (s < 86400*30) return Math.floor(s/86400) + ' 天前';
  if (s < 86400*365) return Math.floor(s/(86400*30)) + ' 个月前';
  return Math.floor(s/(86400*365)) + ' 年前';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// hash 会被拼进 onclick 参数里，源站返回什么不可控，只接受 32/40 位十六进制
function isHash(h){ return typeof h === 'string' && /^([0-9a-fA-F]{32}|[0-9a-fA-F]{40})$/.test(h); }
function setTab(el){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  CUR = el.dataset.src;
  render();
}

/* ---------------- 搜索历史 ----------------
   存在 localStorage，最多 10 条，最新的在最前。
   只存关键词本身，不存结果——结果是几万个字符，撑不起 localStorage 的 5MB 配额。 */
const HIST_KEY = 'magpie_history';
const HIST_MAX = 10;

function histLoad(){
  try {
    const a = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
    return Array.isArray(a) ? a.filter(x => typeof x === 'string' && x.trim()) : [];
  } catch(e) { return []; }
}
function histPush(q){
  q = String(q || '').trim();
  if (!q) return;
  // 已存在的先删掉再插到最前，避免重复项堆积
  const a = histLoad().filter(x => x !== q);
  a.unshift(q);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(a.slice(0, HIST_MAX))); } catch(e) {}
}
function showHist(){
  const a = histLoad();
  const box = document.getElementById('hist');
  if (!a.length) { hideHist(); return; }
  box.innerHTML =
    '<div class="hh"><b>最近搜索</b><span class="clr" onclick="histClear()">清空</span></div>' +
    a.map((q, i) => `<div class="hi" onclick="pickHist(${i})"><i>${i + 1}</i>${esc(q)}</div>`).join('');
  box.style.display = 'block';
}
function hideHist(){
  const box = document.getElementById('hist');
  if (box) box.style.display = 'none';
}
function pickHist(i){
  const a = histLoad();
  if (!a[i]) return;
  qEl.value = a[i];
  hideHist();
  doSearch();
}
function histClear(){
  try { localStorage.removeItem(HIST_KEY); } catch(e) {}
  hideHist();
}

async function fetchT(url, opt, ms){
  const ctl = new AbortController();
  const tm = setTimeout(()=>ctl.abort(), ms);
  try { return await fetch(url, {...opt, signal: ctl.signal}); }
  finally { clearTimeout(tm); }
}
async function srcTPB(q){
  try {
    // apibay 实测慢（2.7~22.5 秒），后端 curl 给 28 秒，这里留 30 秒余量
    const r = await fetchT('cgi-bin/search.cgi?q=' + encodeURIComponent(q), {}, 30000);
    const d = await r.json();
    return (Array.isArray(d) ? d : [])
      // info_hash 全 0 是 apibay 的"无结果"占位记录，必须排除；顺带校验格式
      .filter(x => x && isHash(x.info_hash) && !/^0+$/.test(x.info_hash))
      .map(x => ({hash:x.info_hash, name:x.name, size:+x.size||0,
                  seeders:+x.seeders||0, leechers:+x.leechers||0, src:'tpb'}));
  } catch(e) { return []; }
}
async function srcBtsow(q){
  try {
    const r = await fetchT('cgi-bin/btsow.cgi', {method:'POST', headers:{'Content-Type':'text/plain; charset=utf-8'}, body:q}, 17000);
    const j = await r.json();
    const d = (j && j.data) || [];
    return (Array.isArray(d) ? d : [])
      .filter(x => x && isHash(x.hash))
      .map(x => ({hash:x.hash, name:String(x.name||'').replace(/<\/?em>/g,''),
                  size:+x.size||0, seeders:null, leechers:null, src:'btsow',
                  updated:(+x.lastUpdateTime||0)*1000}));
  } catch(e) { return []; }
}
// YTS：只有英文电影，字段与 apibay 不同。
// 注意 size 是 "487.87 MB" 这种字符串，必须取 size_bytes，否则 +x.size 得 NaN 显示 0 B。
// 一部电影有多个清晰度版本（实测 limit=1 就有 2~3 个 torrent），全部展开成独立条目。
async function srcYTS(q){
  try {
    // 后端最坏 28 秒（直连两跳 6+6，都不通再走代理两跳 8+8），这里给 30 秒余量。
    // 原来只等 20 秒：后端还没跑完前端就先放弃，代理兜底那条路永远等不到结果。
    const r = await fetchT('cgi-bin/yts.cgi?q=' + encodeURIComponent(q), {}, 30000);
    const j = await r.json();
    const movies = (j && j.data && Array.isArray(j.data.movies)) ? j.data.movies : [];
    const rows = [];
    for (const m of movies) {
      if (!m || !Array.isArray(m.torrents)) continue;
      const label = m.title_long || ((m.title || '') + (m.year ? ' (' + m.year + ')' : ''));
      for (const t of m.torrents) {
        if (!t || !isHash(t.hash)) continue;
        // 同一电影同一画质可能有多个压制版本（实测 The Matrix Resurrections 有两条 720p），
        // 只标画质会在页面上出现两条文字完全一样的条目，所以带上 type 区分。
        const tag = [t.quality, t.type].filter(Boolean).join(' ');
        rows.push({hash:t.hash, name:label + (tag ? ' [' + tag + ']' : ''),
                   size:+t.size_bytes||0, seeders:+t.seeds||0, leechers:+t.peers||0, src:'yts',
                   updated:(+t.date_uploaded_unix||0)*1000});
      }
    }
    return rows;
  } catch(e) { return []; }
}
// 页面加载后立即测一次，之后按 next 间隔循环
async function checkStatus(){
  const sb = document.getElementById('statusbar');
  const ts = sb.querySelector('.st-ts');
  let next = 30000;
  try {
    const r = await fetchT('cgi-bin/status.cgi', {}, 10000);
    const d = await r.json();
    sb.querySelectorAll('.st').forEach(el => {
      const k = el.dataset.k, st = d[k];
      const code = (st && st.code) || 'timeout';
      // ok=绿；源站明确返回非 200=红；超时=灰（未知，别误报成故障）
      el.className = 'st ' + (st && st.ok ? 'ok' : (code === 'timeout' ? '' : 'fail'));
      el.querySelector('.dot').title = code;
    });
    if (ts) ts.textContent = '';
  } catch(e) {
    // 拿不到结果只当"未知"（灰点），不标红：红点留给源站明确不可用
    sb.querySelectorAll('.st').forEach(el => { el.className = 'st'; });
    if (ts) ts.textContent = '状态获取失败';
    next = 10000;
  }
  setTimeout(checkStatus, next);
}

// ---- 代理开关 ----
// 只发开关动作，节点信息全在服务端，页面拿不到也不需要拿到。
// 状态一律以重新查询为准，不拿 toggleProxy 的返回值猜"成功"，
// 因为 do_start 里可能启动失败但 HTTP 仍是 200。
let PX = null, PXBUSY = false;
function renderProxy(){
  const b = document.getElementById('px');
  if (!b) return;
  if (!PX)        { b.textContent = '代理:未知'; b.className = 'px'; b.title='状态获取失败'; return; }
  const on = !!PX.on;
  b.className = 'px' + (on ? ' on' : '');
  b.textContent = '代理:' + (on ? '开' : '关');
  // outbound=direct 时开关是空转的：direct 只是透传，不解决封锁，
  // 而且实测经 direct 代理比直连慢一个数量级（YTS 1~2s vs 12.8s）。必须让用户看见。
  if (on && PX.outbound !== 'custom') {
    b.textContent = '代理:开(透传)';
    b.title = '当前配置没有真实节点，只是透传，不会解开被墙的站，反而更慢';
  } else {
    b.title = PX.outbound === 'custom'
      ? ('已接节点，闲置 ' + PX.idle + ' 秒自动关；' + PX.addr)
      : ('未接节点，点了只是空转；闲置 ' + PX.idle + ' 秒自动关');
  }
  if (PXBUSY) { b.disabled = true; b.textContent = '代理:处理中'; }
}
async function checkProxy(){
  try {
    const r = await fetchT('cgi-bin/proxy.cgi', {}, 8000);
    PX = await r.json();
    if (PX && PX.error) PX = null;
  } catch(e) { PX = null; }
  renderProxy();
}
async function toggleProxy(){
  if (PXBUSY) return;
  if (PX && PX.error) return;
  const target = (PX && PX.on) ? 'off' : 'on';
  PXBUSY = true; renderProxy();
  try {
    await fetchT('cgi-bin/proxy.cgi?a=' + target, {}, 25000);
  } catch(e) { /* 超时也要重新查，别信本地假设 */ }
  PXBUSY = false;
  await checkProxy();
}

function sortAll(){
  // 同一个 hash 可能被多个源返回（比如同一部片子的磁力在 TPB 和 YTS 都有，
  // 或翻页时重复出现），先去重再排序，否则列表里会出现两条一模一样的条目。
  const seen = new Set();
  ALL = ALL.filter(x => {
    const k = String(x.hash || '').toUpperCase();
    if (!k || seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  // 有做种数的排前面（TPB / YTS），BTSOW 中文资源多、按更新时间排后面
  const withSeeds = ALL.filter(x => x.seeders !== null)
    .sort((a, b) => (+b.seeders || 0) - (+a.seeders || 0));
  const b = ALL.filter(x => x.seeders === null)
    .sort((a, b2) => (+b2.updated || 0) - (+a.updated || 0));
  ALL = withSeeds.concat(b);
}

async function doSearch(){
  const q = qEl.value.trim();
  if (!q) return;
  hideHist();
  histPush(q);        // 记进历史（重复的会自动提到最前）
  go.disabled = true;
  ALL = [];
  const myReq = ++REQ;
  out.innerHTML = '<div class="hint">搜索中…<br><span style="color:#999;font-size:12px">BTSOW 一般 1 秒内出，YTS 约 3 秒，TPB 可能要 20 秒以上</span></div>';

  // 渐进渲染：三个源快慢差很多，谁先回来先显示，不等 Promise.all 齐了才出
  const merge = rows => {
    if (myReq !== REQ) return;   // 已被更晚发起的搜索取代，丢弃这次结果
    ALL = ALL.concat(rows);
    sortAll();
    render();
    // 已经出结果就把按钮放出来，不必干等最慢的 TPB（实测可到 28 秒）
    if (ALL.length) go.disabled = false;
  };

  await Promise.all([srcBtsow(q).then(merge), srcYTS(q).then(merge), srcTPB(q).then(merge)]);

  if (myReq !== REQ) return;
  go.disabled = false;
  if (!ALL.length) {
    out.innerHTML = '<div class="err">三个源都没有返回结果<br><span style="color:#999;font-size:12px">可能是网络不通，或源站临时不可用</span></div>';
    return;
  }
  render();
}

function render(){
  let d = CUR === 'all' ? ALL : ALL.filter(x => x.src === CUR);
  if (!d.length) { out.innerHTML = '<div class="hint">没有结果</div>'; return; }
  out.innerHTML = d.map(x => `
    <div class="item">
      <div class="name">${esc(x.name)}</div>
      <div class="meta">
        <span class="badge ${x.src==='btsow'?'b':(x.src==='yts'?'y':'')}">${x.src==='btsow'?'BTSOW':(x.src==='yts'?'YTS':'TPB')}</span>
        <span>${fmtSize(x.size)}</span>
        ${x.seeders===null ? (x.updated?`<span class="time">🕒 ${fmtTime(x.updated)}</span>`:'') : `<span class="seed">▲ ${x.seeders}</span><span class="leech">▼ ${x.leechers}</span>`}
        <span class="ops">
          <button onclick="copyMagnet('${x.hash}')">复制</button>
          <button class="pri" onclick="addUri('${x.hash}', this)">下载</button>
        </span>
      </div>
    </div>`).join('');
}

async function addUri(hash, btn){
  btn.disabled = true; btn.textContent = '加入中';
  try {
    // 加超时：aria2 没起或端口不通时，不加限制会一直卡在"加入中"
    const r = await fetchT('cgi-bin/add.cgi?h=' + encodeURIComponent(hash), {}, 15000);
    const d = await r.json();
    if (d && d.result) { btn.textContent = '已加入 ✓'; btn.style.background = '#25a244'; btn.style.color='#fff'; }
    else { btn.textContent = '失败'; btn.disabled = false; alert('加入失败：' + JSON.stringify(d)); }
  } catch (e) {
    btn.textContent = '失败'; btn.disabled = false;
    alert('请求超时或连接失败，确认 aria2 的 RPC 是否在运行');
  }
}
function copyMagnet(hash){
  const m = 'magnet:?xt=urn:btih:' + hash;
  if (navigator.clipboard) navigator.clipboard.writeText(m).then(()=>alert('磁力链接已复制'),()=>prompt('复制磁力链接：', m));
  else prompt('复制磁力链接：', m);
}
/* ---------------- 下载进度 ----------------
   轮询 cgi-bin/list.cgi（后端只做 token 补齐和拼接，解析交给这里）。
   有任务时 3 秒一次，空闲 15 秒一次，别让手机一直醒着。 */
const TB_KEY = 'magpie_tb_open';
let tbTimer = null, tbLastIds = new Set(), tbDoneUntil = 0, tbOpen = false;

// aria2 返回的 bittorrent.info.name 是 base64（原文是 UTF-8 文件名，中文必须这样解）
function b64dec(s){
  try {
    const bin = atob(s);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  } catch(e) { return String(s || ''); }
}
function taskName(t){
  if (t.bittorrent && t.bittorrent.info && t.bittorrent.info.name) return b64dec(t.bittorrent.info.name);
  if (t.files && t.files.length && t.files[0].path) return String(t.files[0].path).split('/').pop();
  return t.gid || '未知任务';
}
function taskPct(t){
  const total = +t.totalLength || 0, done = +t.completedLength || 0;
  if (!total) return 0;
  return Math.min(100, Math.floor(done / total * 100));
}
function toggleTaskbar(){
  tbOpen = !tbOpen;
  document.getElementById('taskbar').classList.toggle('open', tbOpen);
  try { localStorage.setItem(TB_KEY, tbOpen ? '1' : '0'); } catch(e) {}
}

function renderTaskbar(act, wai, stp){
  const bar  = document.getElementById('taskbar');
  const ico  = document.getElementById('tb-ico');
  const txt  = document.getElementById('tb-txt');
  const spd  = document.getElementById('tb-spd');
  const list = document.getElementById('tb-list');
  const live = act.concat(wai);

  if (live.length) {
    const total = live.reduce((s, t) => s + (+t.totalLength || 0), 0);
    const done  = live.reduce((s, t) => s + (+t.completedLength || 0), 0);
    const speed = act.reduce((s, t) => s + (+t.downloadSpeed || 0), 0);
    ico.textContent = '↓';
    ico.style.color = '#007bff';
    txt.textContent = live.length + ' 个任务 · ' + (total ? Math.floor(done / total * 100) : 0) + '%';
    spd.textContent = speed ? fmtSize(speed) + '/s' : '等待中';
    list.innerHTML = live.slice(0, 12).map(t => {
      const sp = +t.downloadSpeed || 0;
      const right = sp ? fmtSize(sp) + '/s' : (t.status === 'paused' ? '已暂停' : '等待中');
      return '<div class="tb-item">' +
        '<div class="tn">' + esc(taskName(t)) + '</div>' +
        '<div class="pr"><i style="width:' + taskPct(t) + '%"></i></div>' +
        '<div class="tm"><span>' + fmtSize(+t.completedLength || 0) + ' / ' + fmtSize(+t.totalLength || 0) +
        '</span><span>' + right + '</span></div></div>';
    }).join('');
    bar.style.display = 'block';
    tbLastIds = new Set(live.map(t => t.gid));
    tbDoneUntil = 0;
    return;
  }

  // 这一轮没有进行中的任务但上一轮有：说明刚下完，给个结果提示再自动收起
  if (tbLastIds.size) {
    const fin  = stp.filter(t => tbLastIds.has(t.gid));
    const okN  = fin.filter(t => t.status === 'complete').length;
    const errN = fin.filter(t => t.status === 'error' || t.status === 'removed').length;
    ico.textContent = errN ? '!' : '✓';
    ico.style.color = errN ? '#c1121f' : '#25a244';
    txt.textContent = errN
      ? errN + ' 个任务失败' + (okN ? '，' + okN + ' 个完成' : '')
      : (okN || fin.length) + ' 个任务已完成';
    spd.textContent = '';
    list.innerHTML = '';
    bar.style.display = 'block';
    tbLastIds = new Set();
    tbDoneUntil = Date.now() + 5000;
    return;
  }

  if (Date.now() < tbDoneUntil) return;   // 完成提示还没到期，先留着
  bar.style.display = 'none';
}

async function pollTasks(){
  clearTimeout(tbTimer);
  let next = 15000;
  try {
    const r = await fetchT('cgi-bin/list.cgi', {}, 12000);
    const d = await r.json();
    if (d && !d.error) {
      const act = (d.active  && Array.isArray(d.active.result))  ? d.active.result  : [];
      const wai = (d.waiting && Array.isArray(d.waiting.result)) ? d.waiting.result : [];
      const stp = (d.stopped && Array.isArray(d.stopped.result)) ? d.stopped.result : [];
      renderTaskbar(act, wai, stp);
      next = (act.length + wai.length) ? 3000 : (Date.now() < tbDoneUntil ? 2000 : 15000);
    } else {
      document.getElementById('taskbar').style.display = 'none';
    }
  } catch(e) {
    // aria2 没起或手机休眠时请求失败，静默处理，不弹窗打扰
  }
  tbTimer = setTimeout(pollTasks, next);
}

qEl.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
qEl.addEventListener('focus', showHist);
qEl.addEventListener('click', showHist);
document.addEventListener('click', e => { if (!e.target.closest('.qwrap')) hideHist(); });
try {
  tbOpen = localStorage.getItem(TB_KEY) === '1';
  if (tbOpen) document.getElementById('taskbar').classList.add('open');
} catch(e) {}
checkStatus();
pollTasks();
// 代理状态只在加载时查一次：它是本机 CGI（实测 0.14 秒），不像源站会漂移，
// 不需要 30 秒轮询；开关后 toggleProxy 内部会主动重查。
checkProxy();
</script>
